{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header text-center" style="background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: white;">
                <h4 class="mb-0"><i class="fas fa-sign-in-alt"></i> Welcome Back</h4>
                <small>Login to your account</small>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label class="form-label"><i class="fas fa-envelope"></i> Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="Enter your email" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label"><i class="fas fa-lock"></i> Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2" style="background: linear-gradient(135deg, #8b5cf6, #7c3aed); border: none;">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                </form>
                
                <hr class="my-4" style="border-color: #475569;">
                
                <div class="text-center">
                    <p class="mb-0">Don't have an account?</p>
                    <a href="{{ url_for('register') }}" class="btn btn-outline-primary mt-2">
                        <i class="fas fa-user-plus"></i> Create an Account
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
