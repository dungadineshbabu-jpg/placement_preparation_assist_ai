{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header text-center" style="background: linear-gradient(135deg, #10b981, #059669); color: white;">
                <h4 class="mb-0"><i class="fas fa-user-plus"></i> Create an Account</h4>
                <small>Start your placement preparation journey</small>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label class="form-label"><i class="fas fa-user"></i> Full Name</label>
                        <input type="text" name="name" class="form-control" placeholder="e.g., John Doe" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><i class="fas fa-envelope"></i> Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="e.g., john@example.com" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label"><i class="fas fa-lock"></i> Password</label>
                            <input type="password" name="password" class="form-control" placeholder="Create password" required minlength="6">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label"><i class="fas fa-lock"></i> Confirm Password</label>
                            <input type="password" name="confirm_password" class="form-control" placeholder="Confirm password" required minlength="6">
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100 py-2 mt-3" style="background: linear-gradient(135deg, #10b981, #059669); border: none;">
                        <i class="fas fa-check-circle"></i> Register
                    </button>
                </form>
                
                <hr class="my-4" style="border-color: #475569;">
                
                <div class="text-center">
                    <p class="mb-0">Already have an account?</p>
                    <a href="{{ url_for('login') }}" class="btn btn-outline-success mt-2">
                        <i class="fas fa-sign-in-alt"></i> Login Here
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
